<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trust Graph — Fraud Case Dashboard</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #888; margin-bottom: 20px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #262a33; font-size: 13px; }
  th { color: #999; font-weight: 600; text-transform: uppercase; font-size: 11px; }
  tr:hover { background: #171a21; }
  .tier { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .no_action { background: #1c3a2a; color: #4ade80; }
  .soft_intervention { background: #3a2f1c; color: #facc15; }
  .hard_action_candidate { background: #3a1c1c; color: #f87171; }
  .badge { background: #1c2b3a; color: #60a5fa; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  #stats { display: flex; gap: 16px; margin-bottom: 20px; }
  .stat { background: #171a21; padding: 12px 16px; border-radius: 8px; flex: 1; }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .label { font-size: 11px; color: #888; }
</style>
</head>
<body>
  <h1>Trust Graph — Fraud Case Dashboard</h1>
  <div class="sub">Live risk scores from graph + rule-based signals</div>

  <div id="stats"></div>
  <table id="table">
    <thead>
      <tr>
        <th>Seller ID</th>
        <th>Risk Score</th>
        <th>Tier</th>
        <th>Needs Review</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
async function load() {
  const res = await fetch('/api/cases');
  const cases = await res.json();

  const total = cases.length;
  const flagged = cases.filter(c => c.needs_agent_review).length;
  const hard = cases.filter(c => c.tier === 'hard_action_candidate').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">Total Sellers</div></div>
    <div class="stat"><div class="num">${flagged}</div><div class="label">Flagged for Review</div></div>
    <div class="stat"><div class="num">${hard}</div><div class="label">Hard Action Candidates</div></div>
  `;

  const rows = cases
    .sort((a, b) => b.final_risk_score - a.final_risk_score)
    .map(c => `
      <tr>
        <td>${c.seller_id}</td>
        <td>${c.final_risk_score}</td>
        <td><span class="tier ${c.tier}">${c.tier.replace(/_/g, ' ')}</span></td>
        <td>${c.needs_agent_review ? '<span class="badge">LLM review</span>' : '—'}</td>
      </tr>
    `).join('');

  document.getElementById('rows').innerHTML = rows;
}
load();
</script>
</body>
</html>
